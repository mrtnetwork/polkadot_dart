# Local fork of Westend Asset Hub (https://github.com/AcalaNetwork/chopsticks)
#
# Start with:
#   chopsticks -c ./chopsticks.yml
#
# The fork keeps the real chain state (pallets, metadata, runtime) while
# letting the examples fund accounts for free through `dev_setStorage`, so no
# faucet or real tokens are needed. JSON-RPC is exposed on http://127.0.0.1:8001.
endpoint: https://westend-asset-hub-rpc.polkadot.io
port: 8001